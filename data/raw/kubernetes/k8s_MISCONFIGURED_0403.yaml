apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-2102
    environment: dev
  name: api-2102
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api-2102
  template:
    metadata:
      labels:
        app: api-2102
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: api-2102
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
