apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-4878
    environment: dev
  name: worker-4878
  namespace: kube-system
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker-4878
  template:
    metadata:
      labels:
        app: worker-4878
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: worker-4878
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
