apiVersion: v1
kind: Pod
metadata:
  name: scheduler-7850
  namespace: production
spec:
  containers:
  - image: ubuntu
    name: scheduler-7850
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: true
  hostPID: true
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
