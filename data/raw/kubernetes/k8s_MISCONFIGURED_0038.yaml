apiVersion: v1
kind: Pod
metadata:
  name: frontend-2612
  namespace: default
spec:
  containers:
  - image: myapp:latest
    name: frontend-2612
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: true
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
