apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metrics-6005
    environment: dev
  name: metrics-6005
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-6005
  template:
    metadata:
      labels:
        app: metrics-6005
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: metrics-6005
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
