apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metrics-9004
    environment: dev
  name: metrics-9004
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-9004
  template:
    metadata:
      labels:
        app: metrics-9004
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: metrics-9004
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
