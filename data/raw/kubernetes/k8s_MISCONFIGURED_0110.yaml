apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-6355
    environment: dev
  name: logging-6355
  namespace: staging
spec:
  replicas: 4
  selector:
    matchLabels:
      app: logging-6355
  template:
    metadata:
      labels:
        app: logging-6355
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: logging-6355
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
