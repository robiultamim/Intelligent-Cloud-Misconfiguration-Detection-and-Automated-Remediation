apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-4457
    environment: dev
  name: processor-4457
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processor-4457
  template:
    metadata:
      labels:
        app: processor-4457
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: processor-4457
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
