apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metrics-7213
    environment: dev
  name: metrics-7213
  namespace: kube-system
spec:
  replicas: 4
  selector:
    matchLabels:
      app: metrics-7213
  template:
    metadata:
      labels:
        app: metrics-7213
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: metrics-7213
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
