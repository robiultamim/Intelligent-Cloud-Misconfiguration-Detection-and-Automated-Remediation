apiVersion: v1
kind: Pod
metadata:
  name: worker-5403
  namespace: dev
spec:
  containers:
  - image: nginx:latest
    name: worker-5403
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: true
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
