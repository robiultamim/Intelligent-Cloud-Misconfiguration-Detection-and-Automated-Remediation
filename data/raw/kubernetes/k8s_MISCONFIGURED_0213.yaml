apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-1422
    environment: dev
  name: processor-1422
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processor-1422
  template:
    metadata:
      labels:
        app: processor-1422
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: processor-1422
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
