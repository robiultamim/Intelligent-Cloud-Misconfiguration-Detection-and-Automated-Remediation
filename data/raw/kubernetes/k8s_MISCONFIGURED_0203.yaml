apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-4830
    environment: dev
  name: processor-4830
  namespace: kube-system
spec:
  replicas: 4
  selector:
    matchLabels:
      app: processor-4830
  template:
    metadata:
      labels:
        app: processor-4830
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: processor-4830
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
