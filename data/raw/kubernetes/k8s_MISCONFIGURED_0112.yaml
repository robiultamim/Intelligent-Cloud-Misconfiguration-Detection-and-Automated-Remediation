apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-3496
    environment: dev
  name: frontend-3496
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-3496
  template:
    metadata:
      labels:
        app: frontend-3496
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: frontend-3496
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
