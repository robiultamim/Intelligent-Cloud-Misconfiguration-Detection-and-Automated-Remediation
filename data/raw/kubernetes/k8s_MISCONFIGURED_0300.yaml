apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-8498
    environment: dev
  name: backend-8498
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-8498
  template:
    metadata:
      labels:
        app: backend-8498
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: backend-8498
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
