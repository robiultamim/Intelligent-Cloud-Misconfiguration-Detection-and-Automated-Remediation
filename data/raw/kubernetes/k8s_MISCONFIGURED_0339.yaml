apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-6456
    environment: dev
  name: worker-6456
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-6456
  template:
    metadata:
      labels:
        app: worker-6456
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: worker-6456
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
