apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-5477
    environment: dev
  name: worker-5477
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-5477
  template:
    metadata:
      labels:
        app: worker-5477
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: worker-5477
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
