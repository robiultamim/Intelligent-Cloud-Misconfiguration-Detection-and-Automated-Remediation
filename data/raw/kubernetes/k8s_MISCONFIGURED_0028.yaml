apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-6947
    environment: dev
  name: backend-6947
  namespace: staging
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend-6947
  template:
    metadata:
      labels:
        app: backend-6947
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: backend-6947
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
