apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-1502
    environment: dev
  name: worker-1502
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-1502
  template:
    metadata:
      labels:
        app: worker-1502
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: worker-1502
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
