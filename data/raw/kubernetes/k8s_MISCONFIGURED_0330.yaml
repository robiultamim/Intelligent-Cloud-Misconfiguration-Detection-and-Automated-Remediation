apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-3007
    environment: dev
  name: logging-3007
  namespace: staging
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logging-3007
  template:
    metadata:
      labels:
        app: logging-3007
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: logging-3007
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
