apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-1964
    environment: dev
  name: processor-1964
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: processor-1964
  template:
    metadata:
      labels:
        app: processor-1964
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: processor-1964
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
