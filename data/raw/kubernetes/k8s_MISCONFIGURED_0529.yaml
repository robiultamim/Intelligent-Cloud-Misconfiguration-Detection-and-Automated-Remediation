apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metrics-5842
    environment: dev
  name: metrics-5842
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-5842
  template:
    metadata:
      labels:
        app: metrics-5842
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: metrics-5842
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
