apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-5602
    environment: production
  name: frontend-5602
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-5602
  template:
    metadata:
      labels:
        app: frontend-5602
    spec:
      automountServiceAccountToken: false
      containers:
      - image: node:20-alpine@sha256:abc123
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: frontend-5602
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 8728
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-frontend-5602
