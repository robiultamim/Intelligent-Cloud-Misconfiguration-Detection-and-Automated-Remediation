apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway-1853
    environment: dev
  name: gateway-1853
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-1853
  template:
    metadata:
      labels:
        app: gateway-1853
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: gateway-1853
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
