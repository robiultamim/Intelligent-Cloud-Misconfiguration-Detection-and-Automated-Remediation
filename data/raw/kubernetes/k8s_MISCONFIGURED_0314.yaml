apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-3223
    environment: dev
  name: backend-3223
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-3223
  template:
    metadata:
      labels:
        app: backend-3223
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: backend-3223
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
