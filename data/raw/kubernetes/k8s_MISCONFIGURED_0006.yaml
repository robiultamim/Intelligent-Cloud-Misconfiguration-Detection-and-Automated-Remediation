apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cache-6635
    environment: dev
  name: cache-6635
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-6635
  template:
    metadata:
      labels:
        app: cache-6635
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: cache-6635
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
