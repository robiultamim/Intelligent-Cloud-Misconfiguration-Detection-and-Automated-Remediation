apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scheduler-1653
    environment: dev
  name: scheduler-1653
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduler-1653
  template:
    metadata:
      labels:
        app: scheduler-1653
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: scheduler-1653
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
