apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-9163
    environment: dev
  name: worker-9163
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-9163
  template:
    metadata:
      labels:
        app: worker-9163
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: worker-9163
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
