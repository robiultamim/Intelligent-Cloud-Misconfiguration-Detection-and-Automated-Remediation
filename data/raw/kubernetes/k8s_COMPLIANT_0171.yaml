apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-8692
    environment: production
  name: backend-8692
  namespace: staging
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend-8692
  template:
    metadata:
      labels:
        app: backend-8692
    spec:
      automountServiceAccountToken: false
      containers:
      - image: node:20-alpine@sha256:abc123
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: backend-8692
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 6546
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-backend-8692
