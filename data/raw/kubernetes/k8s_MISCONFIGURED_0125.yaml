apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth-4630
    environment: dev
  name: auth-4630
  namespace: kube-system
spec:
  replicas: 4
  selector:
    matchLabels:
      app: auth-4630
  template:
    metadata:
      labels:
        app: auth-4630
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: auth-4630
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
