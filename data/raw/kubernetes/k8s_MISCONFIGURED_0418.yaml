apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-1265
    environment: dev
  name: worker-1265
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-1265
  template:
    metadata:
      labels:
        app: worker-1265
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: worker-1265
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
