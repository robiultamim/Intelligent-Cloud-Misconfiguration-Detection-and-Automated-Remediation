apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth-2524
    environment: dev
  name: auth-2524
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-2524
  template:
    metadata:
      labels:
        app: auth-2524
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: auth-2524
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
