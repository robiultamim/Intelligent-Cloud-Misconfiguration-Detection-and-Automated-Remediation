apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-3589
    environment: dev
  name: frontend-3589
  namespace: kube-system
spec:
  replicas: 5
  selector:
    matchLabels:
      app: frontend-3589
  template:
    metadata:
      labels:
        app: frontend-3589
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: frontend-3589
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
