apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway-4492
    environment: dev
  name: gateway-4492
  namespace: monitoring
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway-4492
  template:
    metadata:
      labels:
        app: gateway-4492
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: gateway-4492
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
