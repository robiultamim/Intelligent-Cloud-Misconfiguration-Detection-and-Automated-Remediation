apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-4522
    environment: dev
  name: backend-4522
  namespace: kube-system
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend-4522
  template:
    metadata:
      labels:
        app: backend-4522
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: backend-4522
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
