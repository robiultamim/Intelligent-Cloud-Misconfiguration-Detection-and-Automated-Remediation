apiVersion: v1
kind: Pod
metadata:
  name: cache-1040
  namespace: dev
spec:
  containers:
  - image: nginx:latest
    name: cache-1040
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
