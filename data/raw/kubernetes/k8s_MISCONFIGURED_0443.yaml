apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scheduler-6315
    environment: dev
  name: scheduler-6315
  namespace: kube-system
spec:
  replicas: 5
  selector:
    matchLabels:
      app: scheduler-6315
  template:
    metadata:
      labels:
        app: scheduler-6315
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: scheduler-6315
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
