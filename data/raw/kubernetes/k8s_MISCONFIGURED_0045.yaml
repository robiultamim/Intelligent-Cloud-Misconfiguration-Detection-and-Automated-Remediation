apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scheduler-8811
    environment: dev
  name: scheduler-8811
  namespace: monitoring
spec:
  replicas: 5
  selector:
    matchLabels:
      app: scheduler-8811
  template:
    metadata:
      labels:
        app: scheduler-8811
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: scheduler-8811
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
