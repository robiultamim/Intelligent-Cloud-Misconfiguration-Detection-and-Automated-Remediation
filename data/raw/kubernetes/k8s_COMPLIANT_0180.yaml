apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-9702
    environment: production
  name: api-9702
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-9702
  template:
    metadata:
      labels:
        app: api-9702
    spec:
      automountServiceAccountToken: false
      containers:
      - image: nginx:1.25.3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: api-9702
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 3950
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-api-9702
