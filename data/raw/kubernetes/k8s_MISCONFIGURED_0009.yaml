apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-4733
    environment: dev
  name: processor-4733
  namespace: staging
spec:
  replicas: 4
  selector:
    matchLabels:
      app: processor-4733
  template:
    metadata:
      labels:
        app: processor-4733
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: processor-4733
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
