apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-5905
    environment: dev
  name: processor-5905
  namespace: dev
spec:
  replicas: 5
  selector:
    matchLabels:
      app: processor-5905
  template:
    metadata:
      labels:
        app: processor-5905
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: processor-5905
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
