apiVersion: v1
kind: Pod
metadata:
  name: auth-8025
  namespace: staging
spec:
  containers:
  - image: nginx:latest
    name: auth-8025
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: true
  hostPID: true
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
