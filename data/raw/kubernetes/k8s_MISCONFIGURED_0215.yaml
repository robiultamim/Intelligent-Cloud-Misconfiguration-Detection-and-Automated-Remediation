apiVersion: v1
kind: Pod
metadata:
  name: gateway-2786
  namespace: kube-system
spec:
  containers:
  - image: ubuntu
    name: gateway-2786
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: true
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
