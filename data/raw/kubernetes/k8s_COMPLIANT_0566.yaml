apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-7625
    environment: production
  name: frontend-7625
  namespace: staging
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend-7625
  template:
    metadata:
      labels:
        app: frontend-7625
    spec:
      automountServiceAccountToken: false
      containers:
      - image: nginx:1.25.3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: frontend-7625
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 5093
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-frontend-7625
