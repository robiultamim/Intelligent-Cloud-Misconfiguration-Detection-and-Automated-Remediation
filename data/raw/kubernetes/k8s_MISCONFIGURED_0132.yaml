apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scheduler-5658
    environment: dev
  name: scheduler-5658
  namespace: kube-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scheduler-5658
  template:
    metadata:
      labels:
        app: scheduler-5658
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: scheduler-5658
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
