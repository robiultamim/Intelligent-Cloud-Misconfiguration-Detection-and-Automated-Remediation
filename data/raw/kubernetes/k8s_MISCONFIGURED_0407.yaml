apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth-3347
    environment: dev
  name: auth-3347
  namespace: dev
spec:
  replicas: 5
  selector:
    matchLabels:
      app: auth-3347
  template:
    metadata:
      labels:
        app: auth-3347
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: auth-3347
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
