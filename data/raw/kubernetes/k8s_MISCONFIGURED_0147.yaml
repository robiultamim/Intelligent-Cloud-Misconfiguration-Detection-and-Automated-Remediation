apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-9502
    environment: dev
  name: logging-9502
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-9502
  template:
    metadata:
      labels:
        app: logging-9502
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: logging-9502
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
