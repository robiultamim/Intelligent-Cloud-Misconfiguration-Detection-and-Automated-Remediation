apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-7655
    environment: dev
  name: processor-7655
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processor-7655
  template:
    metadata:
      labels:
        app: processor-7655
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: processor-7655
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
