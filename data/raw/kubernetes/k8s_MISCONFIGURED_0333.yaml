apiVersion: v1
kind: Pod
metadata:
  name: gateway-8491
  namespace: production
spec:
  containers:
  - image: ubuntu
    name: gateway-8491
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
