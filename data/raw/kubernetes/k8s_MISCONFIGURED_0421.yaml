apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cache-3773
    environment: dev
  name: cache-3773
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-3773
  template:
    metadata:
      labels:
        app: cache-3773
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: cache-3773
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
