apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-5537
    environment: dev
  name: api-5537
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-5537
  template:
    metadata:
      labels:
        app: api-5537
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: api-5537
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
