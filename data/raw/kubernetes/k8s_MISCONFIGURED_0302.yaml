apiVersion: v1
kind: Pod
metadata:
  name: frontend-6438
  namespace: staging
spec:
  containers:
  - image: nginx:latest
    name: frontend-6438
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
