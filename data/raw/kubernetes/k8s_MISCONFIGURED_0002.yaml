apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-2679
    environment: dev
  name: worker-2679
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-2679
  template:
    metadata:
      labels:
        app: worker-2679
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: worker-2679
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
