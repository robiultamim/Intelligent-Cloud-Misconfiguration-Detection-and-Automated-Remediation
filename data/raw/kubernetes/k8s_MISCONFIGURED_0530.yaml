apiVersion: v1
kind: Pod
metadata:
  name: processor-2163
  namespace: monitoring
spec:
  containers:
  - image: nginx:latest
    name: processor-2163
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: true
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
