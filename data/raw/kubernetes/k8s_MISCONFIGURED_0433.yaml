apiVersion: v1
kind: Pod
metadata:
  name: frontend-4394
  namespace: monitoring
spec:
  containers:
  - image: ubuntu
    name: frontend-4394
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: true
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
