apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-7790
    environment: production
  name: logging-7790
  namespace: monitoring
spec:
  replicas: 4
  selector:
    matchLabels:
      app: logging-7790
  template:
    metadata:
      labels:
        app: logging-7790
    spec:
      automountServiceAccountToken: false
      containers:
      - image: node:20-alpine@sha256:abc123
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: logging-7790
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 4185
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-logging-7790
