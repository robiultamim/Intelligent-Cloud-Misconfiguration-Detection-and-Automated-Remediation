apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scheduler-5978
    environment: dev
  name: scheduler-5978
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: scheduler-5978
  template:
    metadata:
      labels:
        app: scheduler-5978
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: scheduler-5978
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
