apiVersion: v1
kind: Pod
metadata:
  name: scheduler-4164
  namespace: production
spec:
  containers:
  - image: node:20-alpine@sha256:abc123
    name: scheduler-4164
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1001
  hostNetwork: false
  hostPID: false
  volumes: []
