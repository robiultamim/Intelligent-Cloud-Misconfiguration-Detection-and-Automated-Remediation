apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-5945
    environment: dev
  name: worker-5945
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker-5945
  template:
    metadata:
      labels:
        app: worker-5945
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: worker-5945
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
