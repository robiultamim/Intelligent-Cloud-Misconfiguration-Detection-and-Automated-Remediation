apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-2646
    environment: dev
  name: backend-2646
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-2646
  template:
    metadata:
      labels:
        app: backend-2646
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: backend-2646
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
