apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-7001
    environment: dev
  name: api-7001
  namespace: staging
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-7001
  template:
    metadata:
      labels:
        app: api-7001
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: api-7001
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
