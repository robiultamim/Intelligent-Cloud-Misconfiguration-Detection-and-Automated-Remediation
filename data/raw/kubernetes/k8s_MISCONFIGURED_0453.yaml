apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-1440
    environment: dev
  name: processor-1440
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processor-1440
  template:
    metadata:
      labels:
        app: processor-1440
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: processor-1440
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
