apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-7669
    environment: dev
  name: logging-7669
  namespace: production
spec:
  replicas: 4
  selector:
    matchLabels:
      app: logging-7669
  template:
    metadata:
      labels:
        app: logging-7669
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: logging-7669
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
