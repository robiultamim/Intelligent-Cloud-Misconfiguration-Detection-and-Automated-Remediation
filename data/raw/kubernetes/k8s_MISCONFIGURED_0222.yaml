apiVersion: v1
kind: Pod
metadata:
  name: backend-6120
  namespace: kube-system
spec:
  containers:
  - image: python
    name: backend-6120
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
