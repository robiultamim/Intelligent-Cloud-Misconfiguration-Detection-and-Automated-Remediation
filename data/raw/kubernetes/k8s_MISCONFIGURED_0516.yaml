apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-8529
    environment: dev
  name: processor-8529
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: processor-8529
  template:
    metadata:
      labels:
        app: processor-8529
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: processor-8529
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
