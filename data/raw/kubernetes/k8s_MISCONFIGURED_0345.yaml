apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway-7229
    environment: dev
  name: gateway-7229
  namespace: production
spec:
  replicas: 4
  selector:
    matchLabels:
      app: gateway-7229
  template:
    metadata:
      labels:
        app: gateway-7229
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: gateway-7229
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
