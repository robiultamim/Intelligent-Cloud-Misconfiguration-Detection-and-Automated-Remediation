apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-1400
    environment: production
  name: worker-1400
  namespace: production
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker-1400
  template:
    metadata:
      labels:
        app: worker-1400
    spec:
      automountServiceAccountToken: false
      containers:
      - image: python:3.11-slim
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: worker-1400
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 5011
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-worker-1400
