apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-8022
    environment: dev
  name: processor-8022
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: processor-8022
  template:
    metadata:
      labels:
        app: processor-8022
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: processor-8022
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
