apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-3420
    environment: production
  name: frontend-3420
  namespace: monitoring
spec:
  replicas: 5
  selector:
    matchLabels:
      app: frontend-3420
  template:
    metadata:
      labels:
        app: frontend-3420
    spec:
      automountServiceAccountToken: false
      containers:
      - image: nginx:1.25.3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: frontend-3420
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 3320
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-frontend-3420
