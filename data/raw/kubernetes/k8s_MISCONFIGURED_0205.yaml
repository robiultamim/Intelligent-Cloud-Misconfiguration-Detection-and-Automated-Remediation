apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-1742
    environment: dev
  name: worker-1742
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      app: worker-1742
  template:
    metadata:
      labels:
        app: worker-1742
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: worker-1742
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
