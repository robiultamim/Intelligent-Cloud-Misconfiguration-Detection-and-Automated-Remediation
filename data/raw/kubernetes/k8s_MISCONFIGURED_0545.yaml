apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth-2685
    environment: dev
  name: auth-2685
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-2685
  template:
    metadata:
      labels:
        app: auth-2685
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: auth-2685
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
