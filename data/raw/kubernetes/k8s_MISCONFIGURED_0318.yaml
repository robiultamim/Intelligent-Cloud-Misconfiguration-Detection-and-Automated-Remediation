apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-6067
    environment: dev
  name: backend-6067
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-6067
  template:
    metadata:
      labels:
        app: backend-6067
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: backend-6067
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_PTRACE
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
