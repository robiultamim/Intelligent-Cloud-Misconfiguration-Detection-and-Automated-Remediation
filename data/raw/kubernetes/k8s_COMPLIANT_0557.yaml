apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth-5276
    environment: production
  name: auth-5276
  namespace: staging
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-5276
  template:
    metadata:
      labels:
        app: auth-5276
    spec:
      automountServiceAccountToken: false
      containers:
      - image: node:20-alpine@sha256:abc123
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: auth-5276
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 7438
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-auth-5276
