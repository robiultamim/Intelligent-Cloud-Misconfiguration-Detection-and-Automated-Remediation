apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metrics-3252
    environment: dev
  name: metrics-3252
  namespace: dev
spec:
  replicas: 5
  selector:
    matchLabels:
      app: metrics-3252
  template:
    metadata:
      labels:
        app: metrics-3252
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: metrics-3252
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
