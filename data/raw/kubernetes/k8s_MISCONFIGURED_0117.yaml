apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth-2983
    environment: dev
  name: auth-2983
  namespace: monitoring
spec:
  replicas: 5
  selector:
    matchLabels:
      app: auth-2983
  template:
    metadata:
      labels:
        app: auth-2983
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: auth-2983
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
