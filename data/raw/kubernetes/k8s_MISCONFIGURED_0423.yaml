apiVersion: v1
kind: Pod
metadata:
  name: cache-1990
  namespace: monitoring
spec:
  containers:
  - image: myapp:latest
    name: cache-1990
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
