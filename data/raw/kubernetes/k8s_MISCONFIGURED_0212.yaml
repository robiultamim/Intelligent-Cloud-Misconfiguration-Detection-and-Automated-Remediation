apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-6383
    environment: dev
  name: api-6383
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-6383
  template:
    metadata:
      labels:
        app: api-6383
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: api-6383
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
