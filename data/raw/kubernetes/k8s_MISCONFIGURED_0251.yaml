apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth-8565
    environment: dev
  name: auth-8565
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-8565
  template:
    metadata:
      labels:
        app: auth-8565
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: auth-8565
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
