apiVersion: v1
kind: Pod
metadata:
  name: gateway-8940
  namespace: staging
spec:
  containers:
  - image: node:20-alpine@sha256:abc123
    name: gateway-8940
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1001
  hostNetwork: false
  hostPID: false
  volumes: []
