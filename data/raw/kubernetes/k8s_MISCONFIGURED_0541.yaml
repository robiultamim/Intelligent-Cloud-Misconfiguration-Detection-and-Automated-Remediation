apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-3248
    environment: dev
  name: frontend-3248
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-3248
  template:
    metadata:
      labels:
        app: frontend-3248
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: frontend-3248
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
