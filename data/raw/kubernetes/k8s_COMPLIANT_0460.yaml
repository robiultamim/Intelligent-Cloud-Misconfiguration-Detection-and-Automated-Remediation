apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: processor-1725
    environment: production
  name: processor-1725
  namespace: monitoring
spec:
  replicas: 4
  selector:
    matchLabels:
      app: processor-1725
  template:
    metadata:
      labels:
        app: processor-1725
    spec:
      automountServiceAccountToken: false
      containers:
      - image: python:3.11-slim
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: processor-1725
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 7547
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-processor-1725
