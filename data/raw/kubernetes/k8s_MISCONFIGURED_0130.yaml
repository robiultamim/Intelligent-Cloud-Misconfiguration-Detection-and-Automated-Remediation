apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth-1231
    environment: dev
  name: auth-1231
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-1231
  template:
    metadata:
      labels:
        app: auth-1231
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: auth-1231
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
