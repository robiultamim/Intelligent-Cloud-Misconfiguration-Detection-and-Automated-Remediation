apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metrics-6574
    environment: dev
  name: metrics-6574
  namespace: staging
spec:
  replicas: 4
  selector:
    matchLabels:
      app: metrics-6574
  template:
    metadata:
      labels:
        app: metrics-6574
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: metrics-6574
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
