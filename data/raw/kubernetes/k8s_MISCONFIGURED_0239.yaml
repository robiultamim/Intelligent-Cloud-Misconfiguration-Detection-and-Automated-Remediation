apiVersion: v1
kind: Pod
metadata:
  name: frontend-8532
  namespace: default
spec:
  containers:
  - image: python
    name: frontend-8532
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: true
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
