apiVersion: v1
kind: Pod
metadata:
  name: frontend-5082
  namespace: production
spec:
  containers:
  - image: python:3.11-slim
    name: frontend-5082
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1001
  hostNetwork: false
  hostPID: false
  volumes: []
