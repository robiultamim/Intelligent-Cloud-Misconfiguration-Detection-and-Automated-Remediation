apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-9348
    environment: dev
  name: worker-9348
  namespace: kube-system
spec:
  replicas: 4
  selector:
    matchLabels:
      app: worker-9348
  template:
    metadata:
      labels:
        app: worker-9348
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: worker-9348
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
