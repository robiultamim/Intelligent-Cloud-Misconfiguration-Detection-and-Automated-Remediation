apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-1424
    environment: dev
  name: backend-1424
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-1424
  template:
    metadata:
      labels:
        app: backend-1424
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: backend-1424
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
