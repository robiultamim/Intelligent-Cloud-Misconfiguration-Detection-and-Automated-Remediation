apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scheduler-3281
    environment: dev
  name: scheduler-3281
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scheduler-3281
  template:
    metadata:
      labels:
        app: scheduler-3281
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: scheduler-3281
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
