apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: scheduler-9537
    environment: dev
  name: scheduler-9537
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scheduler-9537
  template:
    metadata:
      labels:
        app: scheduler-9537
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: scheduler-9537
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
