apiVersion: v1
kind: Pod
metadata:
  name: auth-3580
  namespace: dev
spec:
  containers:
  - image: ubuntu
    name: auth-3580
    resources: {}
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      runAsUser: 0
  hostNetwork: false
  hostPID: false
  volumes:
  - hostPath:
      path: /
      type: Directory
    name: host-vol
