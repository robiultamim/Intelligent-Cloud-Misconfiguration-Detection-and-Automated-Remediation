apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-6168
    environment: dev
  name: frontend-6168
  namespace: kube-system
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend-6168
  template:
    metadata:
      labels:
        app: frontend-6168
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: frontend-6168
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
