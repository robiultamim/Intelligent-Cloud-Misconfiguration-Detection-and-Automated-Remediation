apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-6133
    environment: dev
  name: backend-6133
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-6133
  template:
    metadata:
      labels:
        app: backend-6133
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: backend-6133
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
