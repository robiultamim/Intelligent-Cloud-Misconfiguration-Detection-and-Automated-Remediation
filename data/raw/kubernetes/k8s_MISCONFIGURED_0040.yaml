apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-2604
    environment: dev
  name: logging-2604
  namespace: default
spec:
  replicas: 4
  selector:
    matchLabels:
      app: logging-2604
  template:
    metadata:
      labels:
        app: logging-2604
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: logging-2604
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
