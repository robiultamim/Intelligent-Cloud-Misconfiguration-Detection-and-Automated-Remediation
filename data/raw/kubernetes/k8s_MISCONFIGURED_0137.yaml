apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metrics-8381
    environment: dev
  name: metrics-8381
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: metrics-8381
  template:
    metadata:
      labels:
        app: metrics-8381
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: metrics-8381
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: true
      serviceAccountName: default
