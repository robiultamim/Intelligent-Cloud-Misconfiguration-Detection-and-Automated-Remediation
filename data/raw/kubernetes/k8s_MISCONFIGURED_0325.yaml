apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway-3762
    environment: dev
  name: gateway-3762
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-3762
  template:
    metadata:
      labels:
        app: gateway-3762
    spec:
      automountServiceAccountToken: true
      containers:
      - image: nginx:latest
        name: gateway-3762
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
