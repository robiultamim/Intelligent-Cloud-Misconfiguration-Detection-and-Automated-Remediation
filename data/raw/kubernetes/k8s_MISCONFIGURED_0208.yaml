apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cache-4559
    environment: dev
  name: cache-4559
  namespace: kube-system
spec:
  replicas: 5
  selector:
    matchLabels:
      app: cache-4559
  template:
    metadata:
      labels:
        app: cache-4559
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: cache-4559
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
