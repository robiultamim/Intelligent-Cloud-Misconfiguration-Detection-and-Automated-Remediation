apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-6963
    environment: dev
  name: logging-6963
  namespace: kube-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logging-6963
  template:
    metadata:
      labels:
        app: logging-6963
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: logging-6963
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
