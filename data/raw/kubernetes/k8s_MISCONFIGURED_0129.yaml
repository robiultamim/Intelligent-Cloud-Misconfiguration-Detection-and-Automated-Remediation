apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-8933
    environment: dev
  name: api-8933
  namespace: staging
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-8933
  template:
    metadata:
      labels:
        app: api-8933
    spec:
      automountServiceAccountToken: true
      containers:
      - image: ubuntu
        name: api-8933
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: null
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
