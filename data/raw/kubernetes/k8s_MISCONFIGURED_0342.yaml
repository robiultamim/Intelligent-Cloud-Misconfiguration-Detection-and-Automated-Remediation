apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cache-6427
    environment: dev
  name: cache-6427
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cache-6427
  template:
    metadata:
      labels:
        app: cache-6427
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: cache-6427
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: false
      hostPID: true
      serviceAccountName: default
