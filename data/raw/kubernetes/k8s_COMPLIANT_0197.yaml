apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gateway-6994
    environment: production
  name: gateway-6994
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-6994
  template:
    metadata:
      labels:
        app: gateway-6994
    spec:
      automountServiceAccountToken: false
      containers:
      - image: python:3.11-slim
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: gateway-6994
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 9221
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-gateway-6994
