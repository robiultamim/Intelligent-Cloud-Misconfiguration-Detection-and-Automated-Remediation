apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: logging-1519
    environment: production
  name: logging-1519
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logging-1519
  template:
    metadata:
      labels:
        app: logging-1519
    spec:
      automountServiceAccountToken: false
      containers:
      - image: nginx:1.25.3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
        name: logging-1519
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 7698
          seccompProfile:
            type: RuntimeDefault
      hostNetwork: false
      hostPID: false
      serviceAccountName: sa-logging-1519
