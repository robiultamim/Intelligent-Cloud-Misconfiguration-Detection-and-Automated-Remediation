apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-4082
    environment: dev
  name: backend-4082
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-4082
  template:
    metadata:
      labels:
        app: backend-4082
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: backend-4082
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
