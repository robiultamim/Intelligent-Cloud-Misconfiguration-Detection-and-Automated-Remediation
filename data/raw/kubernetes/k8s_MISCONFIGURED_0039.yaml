apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-9786
    environment: dev
  name: api-9786
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-9786
  template:
    metadata:
      labels:
        app: api-9786
    spec:
      automountServiceAccountToken: true
      containers:
      - image: myapp:latest
        name: api-9786
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
