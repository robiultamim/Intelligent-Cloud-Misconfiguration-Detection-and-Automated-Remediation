apiVersion: v1
kind: Pod
metadata:
  name: auth-1266
  namespace: staging
spec:
  containers:
  - image: nginx:1.25.3
    name: auth-1266
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1001
  hostNetwork: false
  hostPID: false
  volumes: []
