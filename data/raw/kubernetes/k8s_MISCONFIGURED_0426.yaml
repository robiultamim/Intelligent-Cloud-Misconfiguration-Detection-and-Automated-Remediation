apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend-2578
    environment: dev
  name: backend-2578
  namespace: monitoring
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-2578
  template:
    metadata:
      labels:
        app: backend-2578
    spec:
      automountServiceAccountToken: true
      containers:
      - image: python
        name: backend-2578
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - ALL
          privileged: true
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      hostNetwork: true
      hostPID: false
      serviceAccountName: default
