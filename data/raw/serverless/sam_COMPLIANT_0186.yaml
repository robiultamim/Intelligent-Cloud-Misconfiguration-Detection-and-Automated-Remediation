AWSTemplateFormatVersion: '2010-09-09'
Resources:
  Fncache4580:
    Properties:
      DeadLetterQueue:
        TargetArn:
          Fn::GetAtt:
          - DLQ
          - Arn
        Type: SQS
      Environment:
        Variables:
          LOG_LEVEL: INFO
          REGION: us-east-1
      Events:
        ApiEvent:
          Properties:
            Auth:
              Authorizer: CognitoAuthorizer
            Method: GET
            Path: /data
          Type: Api
      FunctionName: fn-cache4580
      Handler: index.handler
      Role:
        Fn::GetAtt:
        - Rolecache4580
        - Arn
      Runtime: python3.11
      VpcConfig:
        SecurityGroupIds:
        - sg-12345
        SubnetIds:
        - subnet-abc
    Type: AWS::Serverless::Function
Transform: AWS::Serverless-2016-10-31
